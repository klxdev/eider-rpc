[package]
name = "rpc"
version = "0.8.0"
eider = "0.8"
# `import rpc` and `import rpc.jsonrpc` are the same module
entry = "jsonrpc.ei"
description = "JSON-RPC 2.0 over HTTP on eider-http: a dispatch table, typed methods, batches and notifications, the HTTP handler and a client (docs/jsonrpc.md)"

# the HTTP types, the handler and the client calls: sockets and deadlines. A grant is checked
# against what the program loads of http, so it grants what http's modules use (eider-http's
# docs/services.md, N14)
[deps.http]
git = "https://github.com/klxdev/eider-http.git"
version = "0.8.0"
uses = ["net", "io", "clock", "threads", "fs"]

# request and response bodies; pure, granted nothing
[deps.json]
git = "https://github.com/klxdev/eider-json.git"
version = "0.8.0"

# protobuf messages for gRPC and Connect (rpc/def, rpc/grpc, rpc/connect); pure, granted nothing
[deps.proto]
git = "https://github.com/klxdev/eider-proto.git"
version = "0.8.0"

# gzip for compressed gRPC messages (rpc/grpc); granted what eider-http grants it (eider-pkg grants per package)
[deps.compression]
git = "https://github.com/klxdev/eider-compression.git"
version = "0.8.0"
uses = ["io", "clock"]
